version: "1.1.0"
signed_by: "TM1"

weights:
  s1_self_report: 0.35
  s2_linguistic: 0.25
  s3_case_context: 0.25
  s4_engagement: 0.15
  s5_acoustic: 0.00 # DELIBERATE ZERO — pinned by zod literal(0)

baseline:
  ewma_lambda: 0.3
  sigma_floor: 8
  change_point_z: 2.0
  min_history_for_change_point: 2

tiers: # evaluated top to bottom, first match wins
  - tier: RED
    any_of:
      - change_point: true
      - composite_gte: 70
      - s3_gte: 60 # load-bearing: case file alone can escalate
      - s2_gte: 65 # load-bearing: negative linguistic distress alone escalates to counsellor triage
      - distress_detected: true # architectural: negative reply indicating distress forwards to counsellor
  - tier: AMBER
    any_of:
      - composite_gte: 45
      - z_gte: 1.2
      - first_contact_composite_gte: 60
      - missed_checkins_gte: 3
      - s2_gte: 45
  - tier: GREEN
    default: true

floors:
  model_may_lower_tier: false
  critical_requires_deterministic_trigger: true

escalation:
  CRITICAL:
    ack_required: true
    sla_minutes: 0
    immediate_resources: true
  RED:
    ack_required: true
    sla_minutes: 30
  AMBER:
    ack_required: false
    sla_minutes: 1440
  GREEN:
    ack_required: false
    sla_minutes: 10080 # 7 days
